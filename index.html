<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cổng Dashboard — A.Kitchen Siba Food Vietnam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    /* === Biến màu chính === */
    :root {
      --ink: #1F2A22;
      --cream: #FBF7EE;
      --paper: #FFFFFF;
      --gold: #CE9B3F;
      --gold-dark: #A87A2A;
      --green: #3D6650;
      --green-deep: #25402F;
      --line: #E6DFC9;
      --radius-card: 20px;
      --radius-btn: 12px;
      --shadow-card: 0 1px 2px rgba(31,42,34,.06), 0 10px 28px rgba(31,42,34,.08);
      --shadow-card-hover: 0 2px 4px rgba(31,42,34,.08), 0 16px 36px rgba(31,42,34,.13);
      --transition: .18s ease;
    }

    /* === Reset & Base === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === Header === */
    .header {
      background: linear-gradient(180deg, var(--green-deep), var(--green) 140%);
      color: #F6F1E2;
      padding: 2.5rem 1.5rem 4rem;
      border-radius: 0 0 32px 32px;
      text-align: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      margin-bottom: 1.2rem;
    }

    .header-brand .mark {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      object-fit: contain;
    }

    .header-brand .brand-text {
      text-align: left;
    }

    .header-brand .brand-name {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .header-brand .brand-sub {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      opacity: .6;
      font-weight: 500;
    }

    .header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      margin-bottom: .5rem;
    }

    .header p {
      font-size: .92rem;
      opacity: .82;
      max-width: 520px;
      margin: 0 auto;
    }

    /* === Toolbar (nổi đè header) === */
    .toolbar {
      max-width: 720px;
      margin: -2rem auto 2rem;
      padding: 1rem 1.2rem;
      background: var(--paper);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .toolbar input[type="search"] {
      flex: 1 1 200px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-btn);
      padding: .6rem 1rem;
      font-size: .9rem;
      font-family: inherit;
      background: var(--cream);
      color: var(--ink);
      outline: none;
      transition: border-color var(--transition);
    }

    .toolbar input[type="search"]:focus-visible {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgba(206,155,63,.18);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
    }

    .tag-btn {
      border: 1.5px solid var(--line);
      background: rgba(251,247,238,.6);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 600;
      padding: .35rem .85rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .tag-btn:hover {
      border-color: var(--gold);
    }

    .tag-btn:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 2px;
    }

    .tag-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      border-color: transparent;
    }

    /* === Grid dashboard === */
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }

    /* === Card (đổi thành button) === */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
    }

    .card:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 3px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .75rem;
    }

    .card-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .card-tag {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold-dark);
      background: rgba(206,155,63,.12);
      padding: .2rem .6rem;
      border-radius: 999px;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: .4rem;
      line-height: 1.35;
    }

    .card-desc {
      font-size: .84rem;
      color: #4a5a4e;
      flex: 1;
      margin-bottom: 1rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #F6F1E2;
      font-size: .8rem;
      font-weight: 600;
      padding: .55rem 1.1rem;
      border-radius: var(--radius-btn);
    }

    .card-lock {
      font-size: .7rem;
      color: #8a9a8e;
    }

    /* === Trạng thái rỗng === */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: #8a9a8e;
      font-size: .95rem;
    }

    /* === Footer === */
    .footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: .75rem;
      color: #8a9a8e;
    }

    /* === Modal Overlay === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(31, 42, 34, .55);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-overlay.visible {
      opacity: 1;
    }

    .modal {
      background: var(--paper);
      border-radius: var(--radius-card);
      box-shadow: 0 4px 12px rgba(31,42,34,.1), 0 20px 50px rgba(31,42,34,.18);
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(.95) translateY(8px);
      transition: transform var(--transition);
    }

    .modal-overlay.visible .modal {
      transform: scale(1) translateY(0);
    }

    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      color: var(--ink);
      line-height: 1.35;
    }

    .modal-form { display: flex; flex-direction: column; gap: .9rem; }

    .modal-field label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      margin-bottom: .3rem;
      color: var(--ink);
    }

    .modal-field label .required {
      color: #c0392b;
      margin-left: .15rem;
    }

    .modal-field input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-btn);
      padding: .6rem .9rem;
      font-size: .88rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color var(--transition);
    }

    .modal-field input:focus-visible {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgba(206,155,63,.18);
    }

    .modal-field input.invalid {
      border-color: #c0392b;
    }

    .modal-actions {
      display: flex;
      gap: .6rem;
      margin-top: .5rem;
    }

    .btn-submit {
      flex: 1;
      border: none;
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #F6F1E2;
      font-size: .88rem;
      font-weight: 600;
      padding: .7rem 1.2rem;
      border-radius: var(--radius-btn);
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
    }

    .btn-submit:hover { opacity: .9; }

    .btn-submit:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 2px;
    }

    .btn-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-cancel {
      border: 1.5px solid var(--line);
      background: var(--cream);
      color: var(--ink);
      font-size: .88rem;
      font-weight: 500;
      padding: .7rem 1.2rem;
      border-radius: var(--radius-btn);
      cursor: pointer;
      font-family: inherit;
      transition: border-color var(--transition);
    }

    .btn-cancel:hover { border-color: var(--gold); }

    .btn-cancel:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 2px;
    }

    .modal-error {
      font-size: .8rem;
      color: #c0392b;
      font-weight: 500;
      display: none;
    }

    .modal-error.show { display: block; }

    /* Trạng thái thành công trong modal */
    .modal-success {
      text-align: center;
      padding: 1rem 0;
    }

    .modal-success .success-icon {
      font-size: 2.5rem;
      margin-bottom: .8rem;
    }

    .modal-success p {
      font-size: .9rem;
      color: var(--ink);
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    /* === Accessibility: giảm chuyển động === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }

    /* === Responsive nhỏ === */
    @media (max-width: 480px) {
      .header { padding: 2rem 1rem 3.5rem; }
      .toolbar { margin: -1.5rem .75rem 1.5rem; padding: .8rem; }
      .grid { padding: 0 .75rem 2rem; gap: 1rem; }
      .modal { padding: 1.5rem; }
      .modal-actions { flex-direction: column-reverse; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <img class="mark" src="https://drive.google.com/thumbnail?id=1gTmx63YTDqzU2qfPD7oKzYfhhYSgVWGY&sz=w200" alt="A.Kitchen Logo">
      <div class="brand-text">
        <div class="brand-name">A.Kitchen</div>
        <div class="brand-sub">Siba Food Vietnam</div>
      </div>
    </div>
    <h1>Cổng Dashboard nội bộ</h1>
    <p>Chọn một dashboard để xem báo cáo trực quan — mở bằng tài khoản Google được cấp quyền</p>
  </header>

  <!-- Toolbar: tìm kiếm + tag lọc -->
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Tìm dashboard…" aria-label="Tìm kiếm dashboard">
    <div class="tags" id="tagsContainer"></div>
  </div>

  <!-- Lưới dashboard -->
  <main class="grid" id="grid"></main>

  <!-- Modal xin quyền truy cập -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalContent">
      <!-- Nội dung được render bằng JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">Nội bộ A.Kitchen - Siba Food Vietnam</footer>

  <script>
    /* =========================================================
       CẤU HÌNH GATEKEEPER
       ---------------------------------------------------------
       Sau khi deploy Apps Script Gatekeeper (Phần A), paste URL
       /exec vào đây. Portal sẽ gọi POST đến URL này khi user
       submit form xin quyền truy cập.
       ========================================================= */
    const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbx4rzDP4ore6ucJaTsGTs5-JKWH6500lB3fS4KPUCinnGTkq5ExrEaiXpUZFv7L8dsN/exec";

    /* =========================================================
       DỮ LIỆU DASHBOARD
       ---------------------------------------------------------
       Để thêm dashboard mới: copy một object bên dưới, đổi các
       trường name, icon, tag, desc, url cho phù hợp rồi lưu file.
       ========================================================= */
    const DASHBOARDS = [
      {
        name: "Đánh Giá Chất Lượng Suất Ăn",
        icon: "🍚",
        tag: "Chất lượng",
        desc: "Theo dõi điểm đánh giá theo tiêu chí, mức độ hài lòng và ý kiến khách hàng theo thời gian thực.",
        url: "https://script.google.com/macros/s/AKfycbxBdDtFJ1iBBOdHbtqMrfyj6515FKkDWTXvUJxIgIIpKJZJHZl176A9OdeMtFNcYeOPig/exec"
      },
      {
        name: "A.Kitchen • Quản trị Check-in — ĐHHV",
        icon: "🪪",
        tag: "Vận hành",
        desc: "Quản lý dữ liệu check-in tại điểm phục vụ Đại Học Hùng Vương.",
        url: "https://script.google.com/macros/s/AKfycbw_6ymeXz4YqRu0trNQPesvaFxE-GYMzbnLkC4-tRFXDFBO4tkiPpeFdpwkqgzsQJxm/exec"
      },
      {
        name: "A.Kitchen • Dashboard Vận Hành",
        icon: "📊",
        tag: "Vận hành",
        desc: "Tổng quan số liệu vận hành các bếp ăn công nghiệp A.Kitchen.",
        url: "https://script.google.com/macros/s/AKfycbzrNzaOQv_mnBYiVGcFpfPWbcaKNC9mnmfmiStRoUAQi7ySMp1jAckc7j_ejdYABCGk/exec"
      },
      {
        name: "A.Kitchen • Phân Tích Menu — SH Airport Lounge",
        icon: "🍽️",
        tag: "Kinh doanh",
        desc: "Phân tích hiệu quả thực đơn tại SH Airport Lounge.",
        url: "https://script.google.com/macros/s/AKfycbxF0GL4K1VC2HpcGvT1r-HWd3mUm_b5rTZTw78nTCzuj7IcvSeLUXZjX0RFqLn9C_fm/exec"
      }
    ];

    /* === Phần render & lọc === */
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const tagsContainer = document.getElementById("tagsContainer");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalContent = document.getElementById("modalContent");

    let activeTag = "Tất cả";

    // Sinh danh sách tag tự động từ dữ liệu
    function getUniqueTags() {
      const tags = [...new Set(DASHBOARDS.map(d => d.tag))];
      return ["Tất cả", ...tags];
    }

    // Render các nút tag
    function renderTags() {
      const tags = getUniqueTags();
      tagsContainer.innerHTML = tags.map(t =>
        `<button class="tag-btn${t === activeTag ? ' active' : ''}" data-tag="${t}">${t}</button>`
      ).join("");
    }

    // Render lưới card — dùng <button> thay vì <a>
    function renderGrid() {
      const keyword = searchInput.value.trim().toLowerCase();
      const filtered = DASHBOARDS.filter(d => {
        const matchTag = activeTag === "Tất cả" || d.tag === activeTag;
        const matchSearch = !keyword || d.name.toLowerCase().includes(keyword);
        return matchTag && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">Không tìm thấy dashboard phù hợp.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((d, i) => `
        <button class="card" type="button" data-index="${DASHBOARDS.indexOf(d)}">
          <div class="card-header">
            <span class="card-icon">${d.icon}</span>
            <span class="card-tag">${d.tag}</span>
          </div>
          <div class="card-title">${d.name}</div>
          <div class="card-desc">${d.desc}</div>
          <div class="card-footer">
            <span class="card-btn">Yêu cầu truy cập</span>
            <span class="card-lock">🔒 Yêu cầu quyền truy cập Google</span>
          </div>
        </button>
      `).join("");
    }

    // Sự kiện: bấm tag
    tagsContainer.addEventListener("click", e => {
      if (!e.target.classList.contains("tag-btn")) return;
      activeTag = e.target.dataset.tag;
      renderTags();
      renderGrid();
    });

    // Sự kiện: gõ tìm kiếm
    searchInput.addEventListener("input", renderGrid);

    // Sự kiện: bấm card → mở modal
    grid.addEventListener("click", e => {
      const card = e.target.closest(".card");
      if (!card) return;
      const idx = parseInt(card.dataset.index, 10);
      const dashboard = DASHBOARDS[idx];
      if (dashboard) openModal(dashboard);
    });

    /* === Modal xin quyền truy cập === */
    let lastFocusedElement = null;

    function openModal(dashboard) {
      lastFocusedElement = document.activeElement;

      // Render form
      modalContent.innerHTML = `
        <h2 class="modal-title" id="modalTitle">Yêu cầu truy cập: ${dashboard.name}</h2>
        <form class="modal-form" id="accessForm" novalidate>
          <div class="modal-field">
            <label for="inputName">Họ tên <span class="required">*</span></label>
            <input type="text" id="inputName" required autocomplete="name" placeholder="Nguyễn Văn A">
          </div>
          <div class="modal-field">
            <label for="inputEmail">Email <span class="required">*</span></label>
            <input type="email" id="inputEmail" required autocomplete="email" placeholder="email@company.com">
          </div>
          <div class="modal-field">
            <label for="inputDept">Bộ phận</label>
            <input type="text" id="inputDept" autocomplete="organization" placeholder="Ví dụ: Vận hành, Kinh doanh...">
          </div>
          <p class="modal-error" id="modalError"></p>
          <div class="modal-actions">
            <button type="submit" class="btn-submit" id="btnSubmit">Gửi yêu cầu</button>
            <button type="button" class="btn-cancel" id="btnCancel">Huỷ</button>
          </div>
        </form>
      `;

      // Hiện modal
      modalOverlay.classList.add("open");
      requestAnimationFrame(() => {
        modalOverlay.classList.add("visible");
      });

      // Focus vào ô đầu tiên
      setTimeout(() => {
        document.getElementById("inputName").focus();
      }, 50);

      // Xử lý submit
      const form = document.getElementById("accessForm");
      form.addEventListener("submit", e => {
        e.preventDefault();
        handleSubmit(dashboard);
      });

      // Nút Huỷ
      document.getElementById("btnCancel").addEventListener("click", closeModal);
    }

    function closeModal() {
      modalOverlay.classList.remove("visible");
      setTimeout(() => {
        modalOverlay.classList.remove("open");
        modalContent.innerHTML = "";
      }, 200);
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    // Đóng modal khi bấm overlay
    modalOverlay.addEventListener("click", e => {
      if (e.target === modalOverlay) closeModal();
    });

    // Đóng modal khi bấm Esc
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && modalOverlay.classList.contains("open")) {
        closeModal();
      }
    });

    // Validate email đơn giản
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Xử lý gửi form
    async function handleSubmit(dashboard) {
      const nameInput = document.getElementById("inputName");
      const emailInput = document.getElementById("inputEmail");
      const deptInput = document.getElementById("inputDept");
      const errorEl = document.getElementById("modalError");
      const btnSubmit = document.getElementById("btnSubmit");

      // Reset trạng thái lỗi
      nameInput.classList.remove("invalid");
      emailInput.classList.remove("invalid");
      errorEl.classList.remove("show");

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const dept = deptInput.value.trim();

      // Validate
      if (!name) {
        nameInput.classList.add("invalid");
        nameInput.focus();
        errorEl.textContent = "Vui lòng nhập họ tên.";
        errorEl.classList.add("show");
        return;
      }
      if (!email || !isValidEmail(email)) {
        emailInput.classList.add("invalid");
        emailInput.focus();
        errorEl.textContent = "Email không hợp lệ.";
        errorEl.classList.add("show");
        return;
      }

      // Disable nút, đổi text
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Đang gửi...";

      try {
        // Gửi POST — dùng Content-Type text/plain để né preflight CORS
        const res = await fetch(GATEKEEPER_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: name,
            email: email,
            dept: dept,
            dashboardName: dashboard.name,
            dashboardUrl: dashboard.url
          })
        });

        // Apps Script redirect 302 → fetch sẽ follow tự động
        // Nếu response ok, parse JSON
        let result;
        try {
          result = await res.json();
        } catch (_) {
          // Nếu không parse được JSON nhưng status ok → coi như thành công
          result = { success: true };
        }

        if (result.success !== false) {
          // Hiện thông báo thành công
          modalContent.innerHTML = `
            <div class="modal-success">
              <div class="success-icon">✅</div>
              <p>Yêu cầu đã được gửi!<br>Vui lòng kiểm tra email (kể cả mục Spam) trong ít phút sau khi được duyệt để nhận link truy cập.</p>
              <button type="button" class="btn-submit" onclick="closeModal()">Đóng</button>
            </div>
          `;
        } else {
          // Server trả lỗi logic
          errorEl.textContent = result.message || "Gửi yêu cầu thất bại, vui lòng thử lại.";
          errorEl.classList.add("show");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Gửi yêu cầu";
        }

      } catch (err) {
        // Lỗi mạng / fetch fail
        errorEl.textContent = "Gửi yêu cầu thất bại, vui lòng thử lại.";
        errorEl.classList.add("show");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Gửi yêu cầu";
      }
    }

    // Khởi tạo
    renderTags();
    renderGrid();
  </script>
</body>
</html>
