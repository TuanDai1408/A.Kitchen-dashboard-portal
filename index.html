<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cổng Dashboard — A.Kitchen Siba Food Vietnam</title>
  <link rel="icon" type="image/png" href="logo_akitchen-removebg-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* === Biến màu chính === */
    :root {
      --ink: #1F2A22;
      --cream: #FBF7EE;
      --paper: #FFFFFF;
      --gold: #CE9B3F;
      --gold-dark: #A87A2A;
      --green: #3D6650;
      --green-deep: #25402F;
      --line: #E6DFC9;
      --radius-card: 20px;
      --radius-btn: 12px;
      --shadow-card: 0 1px 2px rgba(31,42,34,.06), 0 10px 28px rgba(31,42,34,.08);
      --shadow-card-hover: 0 2px 4px rgba(31,42,34,.08), 0 16px 36px rgba(31,42,34,.13);
      --transition: .18s ease;
    }

    /* === Reset & Base === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* === Login Overlay === */
    .login-overlay { position:fixed; inset:0; background:var(--cream); display:flex; align-items:center; justify-content:center; z-index:2000; }
    .login-overlay.hidden { display:none; }
    .login-card { background:var(--paper); border-radius:var(--radius-card); padding:48px 40px; text-align:center; box-shadow:var(--shadow-card); max-width:400px; width:90%; }
    .login-logo { height:64px; margin-bottom:20px; border-radius:12px; }
    .login-card h2 { font-family:var(--font-heading,'Fraunces',serif); color:var(--green-deep); font-size:1.4rem; margin-bottom:8px; }
    .login-card p { color:var(--ink); font-size:.9rem; opacity:.7; margin-bottom:24px; }
    .login-error { color:#c0392b; font-size:.85rem; margin-top:16px; display:none; }
    .login-error.show { display:block; }

    /* === User Bar === */
    .user-bar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:rgba(206,155,63,.08); border-radius:var(--radius-btn); margin-bottom:12px; }
    .user-bar .user-email { font-size:.85rem; color:var(--ink); font-weight:500; }
    .user-bar .btn-logout { margin-left:auto; background:none; border:1.5px solid var(--line); padding:6px 14px; border-radius:8px; font-size:.8rem; cursor:pointer; font-family:inherit; color:var(--ink); }
    .user-bar .btn-logout:hover { border-color:var(--gold); color:var(--gold-dark); }

    /* === Header === */
    .header {
      background: linear-gradient(180deg, var(--green-deep), var(--green) 140%);
      color: #F6F1E2;
      padding: 2.5rem 1.5rem 4rem;
      border-radius: 0 0 32px 32px;
      text-align: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      margin-bottom: 1.2rem;
    }

    .header-brand .mark {
      height: 48px;
      width: auto;
      flex-shrink: 0;
      border-radius: 6px;
      object-fit: contain;
    }

    .header-brand .brand-text { text-align: left; }

    .header-brand .brand-name {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .header-brand .brand-sub {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      opacity: .6;
      font-weight: 500;
    }

    .header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      margin-bottom: .5rem;
    }

    .header p {
      font-size: .92rem;
      opacity: .82;
      max-width: 520px;
      margin: 0 auto;
    }

    /* === Toolbar === */
    .toolbar {
      max-width: 720px;
      margin: -2rem auto 2rem;
      padding: 1rem 1.2rem;
      background: var(--paper);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .toolbar input[type="search"] {
      flex: 1 1 200px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-btn);
      padding: .6rem 1rem;
      font-size: .9rem;
      font-family: inherit;
      background: var(--cream);
      color: var(--ink);
      outline: none;
      transition: border-color var(--transition);
    }

    .toolbar input[type="search"]:focus-visible {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgba(206,155,63,.18);
    }

    .tags { display: flex; flex-wrap: wrap; gap: .45rem; }

    .tag-btn {
      border: 1.5px solid var(--line);
      background: rgba(251,247,238,.6);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 600;
      padding: .35rem .85rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .tag-btn:hover { border-color: var(--gold); }

    .tag-btn:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 2px;
    }

    .tag-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #fff;
      border-color: transparent;
    }

    /* === Grid === */
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      flex: 1;
    }

    /* === Card === */
    .card {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      font-size: inherit;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-card-hover);
    }

    .card:focus-visible {
      outline: 2.5px solid var(--gold-dark);
      outline-offset: 3px;
    }

    .card-header { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
    .card-icon { font-size: 1.6rem; line-height: 1; }

    .card-tag {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold-dark);
      background: rgba(206,155,63,.12);
      padding: .2rem .6rem;
      border-radius: 999px;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: .4rem;
      line-height: 1.35;
    }

    .card-desc { font-size: .84rem; color: #4a5a4e; flex: 1; margin-bottom: 1rem; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #F6F1E2;
      font-size: .8rem;
      font-weight: 600;
      padding: .55rem 1.1rem;
      border-radius: var(--radius-btn);
    }

    /* Nút cho dashboard công khai */
    .card-btn.public {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    }

    .card-lock { font-size: .7rem; color: #8a9a8e; }

    /* === Loading / Empty === */
    .loading, .empty, .error-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: #8a9a8e;
      font-size: .95rem;
    }

    .error-msg { color: #c0392b; }

    .loading-spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: .8rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* === Footer === */
    .footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: .75rem;
      color: #8a9a8e;
    }

    /* === Modal Overlay === */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(31, 42, 34, .55);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .modal-overlay.open { display: flex; }
    .modal-overlay.visible { opacity: 1; }

    .modal {
      background: var(--paper);
      border-radius: var(--radius-card);
      box-shadow: 0 4px 12px rgba(31,42,34,.1), 0 20px 50px rgba(31,42,34,.18);
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(.95) translateY(8px);
      transition: transform var(--transition);
    }

    .modal-overlay.visible .modal { transform: scale(1) translateY(0); }

    .modal-title {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.15rem;
      margin-bottom: 1.2rem;
      color: var(--ink);
      line-height: 1.35;
    }

    .modal-form { display: flex; flex-direction: column; gap: .9rem; }

    .modal-field label {
      display: block;
      font-size: .78rem;
      font-weight: 600;
      margin-bottom: .3rem;
      color: var(--ink);
    }

    .modal-field label .required { color: #c0392b; margin-left: .15rem; }

    .modal-field input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-btn);
      padding: .6rem .9rem;
      font-size: .88rem;
      font-family: inherit;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color var(--transition);
    }

    .modal-field input:focus-visible {
      border-color: var(--gold-dark);
      box-shadow: 0 0 0 3px rgba(206,155,63,.18);
    }

    .modal-field input.invalid { border-color: #c0392b; }

    .modal-actions { display: flex; gap: .6rem; margin-top: .5rem; }

    .btn-submit {
      flex: 1;
      border: none;
      background: linear-gradient(135deg, var(--green-deep), var(--green));
      color: #F6F1E2;
      font-size: .88rem;
      font-weight: 600;
      padding: .7rem 1.2rem;
      border-radius: var(--radius-btn);
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
    }

    .btn-submit:hover { opacity: .9; }
    .btn-submit:focus-visible { outline: 2.5px solid var(--gold-dark); outline-offset: 2px; }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    .btn-cancel {
      border: 1.5px solid var(--line);
      background: var(--cream);
      color: var(--ink);
      font-size: .88rem;
      font-weight: 500;
      padding: .7rem 1.2rem;
      border-radius: var(--radius-btn);
      cursor: pointer;
      font-family: inherit;
      transition: border-color var(--transition);
    }

    .btn-cancel:hover { border-color: var(--gold); }
    .btn-cancel:focus-visible { outline: 2.5px solid var(--gold-dark); outline-offset: 2px; }

    .modal-error { font-size: .8rem; color: #c0392b; font-weight: 500; display: none; }
    .modal-error.show { display: block; }

    .modal-success { text-align: center; padding: 1rem 0; }
    .modal-success .success-icon { font-size: 2.5rem; margin-bottom: .8rem; }
    .modal-success p { font-size: .9rem; color: var(--ink); line-height: 1.6; margin-bottom: 1.2rem; }

    /* === Accessibility: giảm chuyển động === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* === Responsive: Tablet (768px trở xuống) === */
    @media (max-width: 768px) {
      .header { padding: 2rem 1.25rem 3.5rem; }
      .header h1 { font-size: 1.5rem; }
      .header p { font-size: .85rem; }

      .toolbar {
        max-width: 100%;
        margin: -1.5rem 1rem 1.5rem;
        padding: .9rem 1rem;
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar input[type="search"] {
        flex: none;
        width: 100%;
      }

      .tags {
        justify-content: flex-start;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      .tags::-webkit-scrollbar { display: none; }

      .tag-btn {
        white-space: nowrap;
        flex-shrink: 0;
      }

      .grid {
        padding: 0 1rem 2.5rem;
        gap: 1.2rem;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }

      .card { padding: 1.25rem; }
      .card-title { font-size: 1rem; }
    }

    /* === Responsive: Mobile nhỏ (480px trở xuống) === */
    @media (max-width: 480px) {
      .header {
        padding: 1.75rem .75rem 3rem;
        border-radius: 0 0 24px 24px;
      }

      .header-brand { gap: .5rem; margin-bottom: 1rem; }
      .header-brand .mark { width: 34px; height: 34px; }
      .header-brand .brand-name { font-size: 1.15rem; }
      .header h1 { font-size: 1.3rem; }
      .header p { font-size: .8rem; padding: 0 .25rem; }

      .toolbar {
        margin: -1.2rem .5rem 1.2rem;
        padding: .75rem;
        border-radius: 16px;
      }

      .toolbar input[type="search"] {
        padding: .55rem .8rem;
        font-size: .85rem;
      }

      .tag-btn {
        font-size: .72rem;
        padding: .3rem .7rem;
      }

      .grid {
        padding: 0 .5rem 2rem;
        gap: .9rem;
        grid-template-columns: 1fr;
      }

      .card {
        padding: 1.1rem;
        border-radius: 16px;
      }

      .card-icon { font-size: 1.4rem; }
      .card-title { font-size: .95rem; }
      .card-desc { font-size: .8rem; margin-bottom: .8rem; }

      .card-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: .4rem;
      }

      .card-btn {
        font-size: .76rem;
        padding: .5rem .9rem;
        width: 100%;
        justify-content: center;
      }

      .card-lock { font-size: .66rem; }

      .modal {
        padding: 1.25rem;
        border-radius: 16px;
        max-height: 85vh;
      }

      .modal-title { font-size: 1.05rem; margin-bottom: 1rem; }

      .modal-field input {
        padding: .6rem .75rem;
        font-size: .85rem;
      }

      .modal-actions {
        flex-direction: column-reverse;
        gap: .5rem;
      }

      .btn-submit, .btn-cancel {
        width: 100%;
        text-align: center;
        padding: .75rem 1rem;
      }

      .footer { font-size: .7rem; padding: 1.2rem .75rem; }

      .login-card { padding: 32px 24px; }
      .login-logo { height: 48px; }
      .login-card h2 { font-size: 1.2rem; }
    }

    /* === Touch-friendly: tăng vùng bấm trên thiết bị cảm ứng === */
    @media (pointer: coarse) {
      .tag-btn { padding: .45rem 1rem; min-height: 36px; }
      .card { padding: 1.4rem; }
      .toolbar input[type="search"] { padding: .7rem 1rem; min-height: 44px; }
      .modal-field input { padding: .7rem .9rem; min-height: 44px; }
      .btn-submit, .btn-cancel { min-height: 48px; }
    }
  </style>
</head>
<body>

  <!-- Login Overlay — hiển thị mặc định, ẩn sau khi xác thực -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <img src="logo_akitchen_2.jpg" alt="A.Kitchen" class="login-logo">
      <h2>Cổng Dashboard Nội Bộ</h2>
      <p>Đăng nhập bằng tài khoản Google được cấp quyền</p>
      <div id="googleSignInBtn"></div>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <img class="mark" src="logo_akitchen_2.jpg" alt="A.Kitchen">
      <div class="brand-text">
        <div class="brand-name">A.Kitchen</div>
        <div class="brand-sub">Siba Food Vietnam</div>
      </div>
    </div>
    <h1>Cổng Dashboard nội bộ</h1>
    <p>Chọn một dashboard để xem báo cáo trực quan — mở bằng tài khoản Google được cấp quyền</p>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="user-bar" id="userBar" style="display:none;">
      <span class="user-email" id="userEmail"></span>
      <button class="btn-logout" onclick="logout()">Đăng xuất</button>
    </div>
    <input type="search" id="searchInput" placeholder="Tìm dashboard…" aria-label="Tìm kiếm dashboard">
    <div class="tags" id="tagsContainer"></div>
  </div>

  <!-- Lưới dashboard -->
  <main class="grid" id="grid">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>Đang tải danh sách dashboard...</div>
    </div>
  </main>

  <!-- Modal xin quyền truy cập -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">Nội bộ A.Kitchen - Siba Food Vietnam</footer>

  <script>
    /* =========================================================
       CẤU HÌNH
       ========================================================= */
    const GATEKEEPER_URL = "https://script.google.com/macros/s/AKfycbx4rzDP4ore6ucJaTsGTs5-JKWH6500lB3fS4KPUCinnGTkq5ExrEaiXpUZFv7L8dsN/exec";

    // === CẤU HÌNH AUTH ===
    const AUTH_API_URL = GATEKEEPER_URL; // Cùng endpoint, routing theo action trong doPost
    const GOOGLE_CLIENT_ID = "241889016372-b7klaa5uff117fck5tl4ajj39ukvfftr.apps.googleusercontent.com"; // ← Client ID từ Google Cloud Console
    const SESSION_KEY = "portal_session";

    /* =========================================================
       DỮ LIỆU DASHBOARD — Load động từ Google Sheet
       ========================================================= */
    let DASHBOARDS = [];

    /* === DOM Elements === */
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const tagsContainer = document.getElementById("tagsContainer");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalContent = document.getElementById("modalContent");

    let activeTag = "Tất cả";

    /* =========================================================
       AUTH FUNCTIONS — Google Sign-In + Session Management
       ========================================================= */

    // === KHỞI TẠO: Kiểm tra session hoặc hiện login ===
    async function initAuth() {
      const session = checkExistingSession();
      if (session) {
        // Session còn hạn → render luôn
        showPortal(session);
      } else {
        // Hiện form đăng nhập Google
        showLogin();
      }
    }

    // Kiểm tra session trong localStorage
    function checkExistingSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const session = JSON.parse(raw);
        if (!session.expiresAt || Date.now() > session.expiresAt) {
          localStorage.removeItem(SESSION_KEY);
          return null;
        }
        return session;
      } catch (e) {
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
    }

    // Hiện form login
    function showLogin() {
      document.getElementById('loginOverlay').classList.remove('hidden');
      // Chờ Google Identity Services load xong rồi render nút
      _waitForGIS(function() {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleLogin
          });
          google.accounts.id.renderButton(
            document.getElementById('googleSignInBtn'),
            { theme: 'outline', size: 'large', width: 300, text: 'signin_with', locale: 'vi' }
          );
        } catch (err) {
          console.log('GIS render error:', err);
          // Fallback: hiện thông báo lỗi
          document.getElementById('googleSignInBtn').innerHTML =
            '<p style="color:#c0392b;font-size:.85rem;">Không tải được nút đăng nhập Google.<br>Kiểm tra lại Client ID hoặc kết nối mạng.</p>';
        }
      });
    }

    // Chờ google.accounts.id sẵn sàng (GIS script load async)
    function _waitForGIS(callback, attempts) {
      attempts = attempts || 0;
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        callback();
      } else if (attempts < 50) {
        // Retry mỗi 100ms, tối đa 5 giây
        setTimeout(function() { _waitForGIS(callback, attempts + 1); }, 100);
      } else {
        // Timeout: hiện nút fallback
        console.log('Google Identity Services không load được sau 5 giây');
        document.getElementById('googleSignInBtn').innerHTML =
          '<p style="color:#c0392b;font-size:.85rem;">Không tải được Google Sign-In.<br>Vui lòng tải lại trang (F5).</p>' +
          '<button onclick="location.reload()" style="margin-top:12px;padding:10px 24px;border:1.5px solid #E6DFC9;border-radius:10px;background:#FBF7EE;cursor:pointer;font-family:inherit;font-weight:600;">↻ Tải lại trang</button>';
      }
    }

    // Callback sau khi user đăng nhập Google thành công
    async function handleGoogleLogin(response) {
      const errEl = document.getElementById('loginError');
      errEl.classList.remove('show');

      try {
        const res = await fetch(AUTH_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'checkAuth', idToken: response.credential })
        });
        const result = await res.json();

        if (!result.success) {
          errEl.textContent = result.message || 'Đăng nhập thất bại';
          errEl.classList.add('show');
          return;
        }

        // Lưu session
        const session = {
          token: result.sessionToken,
          email: result.email,
          dashboards: result.allowedDashboards || [],
          expiresAt: result.expiresAt
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        showPortal(session);

      } catch (err) {
        errEl.textContent = 'Lỗi kết nối: ' + err.message;
        errEl.classList.add('show');
        console.log('handleGoogleLogin error:', err);
      }
    }

    // Hiện portal sau khi xác thực thành công
    function showPortal(session) {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('userBar').style.display = 'flex';
      document.getElementById('userEmail').textContent = session.email;
      // Load TẤT CẢ dashboards — không filter theo quyền ở portal
      // Phân quyền chỉ kiểm tra khi user click vào dashboard cụ thể
      loadDashboards(session);
    }

    // Đăng xuất — hiện lại form đăng nhập ngay (không reload trang)
    function logout() {
      localStorage.removeItem(SESSION_KEY);
      // Ẩn user bar, hiện login overlay
      document.getElementById('userBar').style.display = 'none';
      document.getElementById('loginOverlay').classList.remove('hidden');
      // Xóa nội dung grid
      grid.innerHTML = '';
      // Render lại nút đăng nhập Google
      document.getElementById('googleSignInBtn').innerHTML = '';
      _waitForGIS(function() {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleLogin
          });
          google.accounts.id.renderButton(
            document.getElementById('googleSignInBtn'),
            { theme: 'outline', size: 'large', width: 300, text: 'signin_with', locale: 'vi' }
          );
        } catch (err) {
          console.log('Re-render GIS button error:', err);
        }
      });
    }

    /* =========================================================
       DASHBOARD FUNCTIONS
       ========================================================= */

    // === Load danh sách dashboard từ API ===
    async function loadDashboards(session) {
      try {
        const res = await fetch(GATEKEEPER_URL);
        const json = await res.json();

        if (json.success && Array.isArray(json.data)) {
          DASHBOARDS = json.data;
        } else {
          grid.innerHTML = `<div class="error-msg">Không tải được danh sách dashboard.<br><small>${json.message || ''}</small></div>`;
          return;
        }
      } catch (err) {
        grid.innerHTML = `<div class="error-msg">Lỗi kết nối. Vui lòng tải lại trang.<br><small>${err.message}</small></div>`;
        return;
      }

      // Hiển thị TẤT CẢ dashboard — phân quyền chỉ kiểm tra khi user click vào
      // (không filter theo session.dashboards ở portal)

      // Render sau khi load xong
      renderTags();
      renderGrid(session);
    }

    /* === Render tags === */
    function getUniqueTags() {
      const tags = [...new Set(DASHBOARDS.map(d => d.tag))];
      return ["Tất cả", ...tags];
    }

    function renderTags() {
      const tags = getUniqueTags();
      tagsContainer.innerHTML = tags.map(t =>
        `<button class="tag-btn${t === activeTag ? ' active' : ''}" data-tag="${t}">${t}</button>`
      ).join("");
    }

    /* === Render grid cards === */
    // Biến lưu session hiện tại để dùng trong renderGrid
    let currentSession = null;

    function renderGrid(session) {
      // Cập nhật session nếu được truyền vào
      if (session !== undefined) currentSession = session;

      const keyword = searchInput.value.trim().toLowerCase();
      const filtered = DASHBOARDS.filter(d => {
        const matchTag = activeTag === "Tất cả" || d.tag === activeTag;
        const matchSearch = !keyword || d.name.toLowerCase().includes(keyword);
        return matchTag && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">Không tìm thấy dashboard phù hợp.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((d, i) => {
        const idx = DASHBOARDS.indexOf(d);
        // Xây dựng URL với token + email nếu có session
        let dashUrl = d.url;
        if (currentSession && currentSession.token) {
          const separator = dashUrl.includes('?') ? '&' : '?';
          dashUrl += separator + 'token=' + currentSession.token + '&email=' + encodeURIComponent(currentSession.email);
        }

        if (d.requireAccess) {
          // Dashboard cần xin quyền → button mở modal
          return `
            <button class="card" type="button" data-index="${idx}">
              <div class="card-header">
                <span class="card-icon">${d.icon}</span>
                <span class="card-tag">${d.tag}</span>
              </div>
              <div class="card-title">${d.name}</div>
              <div class="card-desc">${d.desc}</div>
              <div class="card-footer">
                <span class="card-btn">Yêu cầu truy cập</span>
                <span class="card-lock">🔒 Cần quyền truy cập</span>
              </div>
            </button>`;
        } else {
          // Dashboard được phép → link mở thẳng (có token)
          return `
            <a class="card" href="${dashUrl}" target="_blank" rel="noopener" data-index="${idx}">
              <div class="card-header">
                <span class="card-icon">${d.icon}</span>
                <span class="card-tag">${d.tag}</span>
              </div>
              <div class="card-title">${d.name}</div>
              <div class="card-desc">${d.desc}</div>
              <div class="card-footer">
                <span class="card-btn public">Mở dashboard ↗</span>
                <span class="card-lock">🌐 Truy cập tự do</span>
              </div>
            </a>`;
        }
      }).join("");
    }

    /* === Sự kiện: tag === */
    tagsContainer.addEventListener("click", e => {
      if (!e.target.classList.contains("tag-btn")) return;
      activeTag = e.target.dataset.tag;
      renderTags();
      renderGrid();
    });

    /* === Sự kiện: tìm kiếm === */
    searchInput.addEventListener("input", () => renderGrid());

    /* === Sự kiện: bấm card cần quyền → mở modal === */
    grid.addEventListener("click", e => {
      const card = e.target.closest("button.card");
      if (!card) return;
      const idx = parseInt(card.dataset.index, 10);
      const dashboard = DASHBOARDS[idx];
      if (dashboard && dashboard.requireAccess) openModal(dashboard);
    });

    /* === Modal === */
    let lastFocusedElement = null;

    function openModal(dashboard) {
      lastFocusedElement = document.activeElement;

      modalContent.innerHTML = `
        <h2 class="modal-title" id="modalTitle">Yêu cầu truy cập: ${dashboard.name}</h2>
        <form class="modal-form" id="accessForm" novalidate>
          <div class="modal-field">
            <label for="inputName">Họ tên <span class="required">*</span></label>
            <input type="text" id="inputName" required autocomplete="name" placeholder="Nguyễn Văn A">
          </div>
          <div class="modal-field">
            <label for="inputEmail">Email <span class="required">*</span></label>
            <input type="email" id="inputEmail" required autocomplete="email" placeholder="email@congty.com hoặc @gmail.com">
            <small style="color:#8a9a8e;font-size:.72rem;margin-top:.2rem;display:block;">Nhập email bạn thường dùng để nhận link truy cập dashboard</small>
          </div>
          <div class="modal-field">
            <label for="inputDept">Bộ phận</label>
            <input type="text" id="inputDept" autocomplete="organization" placeholder="Ví dụ: Vận hành, Kinh doanh...">
          </div>
          <p class="modal-error" id="modalError"></p>
          <div class="modal-actions">
            <button type="submit" class="btn-submit" id="btnSubmit">Gửi yêu cầu</button>
            <button type="button" class="btn-cancel" id="btnCancel">Huỷ</button>
          </div>
        </form>
      `;

      modalOverlay.classList.add("open");
      requestAnimationFrame(() => modalOverlay.classList.add("visible"));

      setTimeout(() => document.getElementById("inputName").focus(), 50);

      document.getElementById("accessForm").addEventListener("submit", e => {
        e.preventDefault();
        handleSubmit(dashboard);
      });

      document.getElementById("btnCancel").addEventListener("click", closeModal);
    }

    function closeModal() {
      modalOverlay.classList.remove("visible");
      setTimeout(() => {
        modalOverlay.classList.remove("open");
        modalContent.innerHTML = "";
      }, 200);
      if (lastFocusedElement) lastFocusedElement.focus();
    }

    modalOverlay.addEventListener("click", e => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
    });

    // Validate email — chấp nhận mọi email hợp lệ (Gmail, email công ty, v.v.)
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function handleSubmit(dashboard) {
      const nameInput = document.getElementById("inputName");
      const emailInput = document.getElementById("inputEmail");
      const deptInput = document.getElementById("inputDept");
      const errorEl = document.getElementById("modalError");
      const btnSubmit = document.getElementById("btnSubmit");

      nameInput.classList.remove("invalid");
      emailInput.classList.remove("invalid");
      errorEl.classList.remove("show");

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const dept = deptInput.value.trim();

      if (!name) {
        nameInput.classList.add("invalid");
        nameInput.focus();
        errorEl.textContent = "Vui lòng nhập họ tên.";
        errorEl.classList.add("show");
        return;
      }
      if (!email || !isValidEmail(email)) {
        emailInput.classList.add("invalid");
        emailInput.focus();
        errorEl.textContent = "Email không hợp lệ.";
        errorEl.classList.add("show");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Đang gửi...";

      try {
        const res = await fetch(GATEKEEPER_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            name: name,
            email: email,
            dept: dept,
            dashboardName: dashboard.name,
            dashboardUrl: dashboard.url
          })
        });

        let result;
        try { result = await res.json(); }
        catch (_) { result = { success: true }; }

        if (result.success !== false) {
          modalContent.innerHTML = `
            <div class="modal-success">
              <div class="success-icon">✅</div>
              <p>Yêu cầu đã được gửi!<br>Vui lòng kiểm tra email (kể cả mục Spam) trong ít phút sau khi được duyệt để nhận link truy cập.</p>
              <button type="button" class="btn-submit" onclick="closeModal()">Đóng</button>
            </div>
          `;
        } else {
          errorEl.textContent = result.message || "Gửi yêu cầu thất bại, vui lòng thử lại.";
          errorEl.classList.add("show");
          btnSubmit.disabled = false;
          btnSubmit.textContent = "Gửi yêu cầu";
        }
      } catch (err) {
        errorEl.textContent = "Gửi yêu cầu thất bại, vui lòng thử lại.";
        errorEl.classList.add("show");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Gửi yêu cầu";
      }
    }

    /* === Khởi động: kiểm tra auth trước === */
    initAuth();
  </script>
</body>
</html>
